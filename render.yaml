# Render Blueprint: PostgreSQL + REST API + static web app in one click.
# Dashboard → New → Blueprint → select this repository.
#
# The URLs below assume Render keeps the service names (orbit-pms-api / orbit-pms-web).
# If it adds a suffix, update VITE_API_URL and CORS_ORIGINS (and mobile/eas.json), then redeploy.

databases:
  - name: orbit-pms-db
    plan: free
    databaseName: orbit_pms
    user: orbit_pms
    postgresMajorVersion: "17"
    # Empty allow list: only Render services in the same region can connect (no public access).
    ipAllowList: []

services:
  - type: web
    name: orbit-pms-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    # Applies pending Prisma migrations, then starts the API.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-pms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGINS
        value: https://orbit-pms-web.onrender.com
      # Render puts one proxy in front of the service; needed for per-IP rate limiting.
      - key: TRUST_PROXY
        value: "1"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"

  - type: web
    name: orbit-pms-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: web/dist
    buildFilter:
      paths:
        - web/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://orbit-pms-api.onrender.com/api
    routes:
      # Client-side routing: every path serves the SPA entry point.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
