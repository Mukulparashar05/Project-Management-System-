# Local PostgreSQL for development:            docker compose up -d
# PostgreSQL + the API in a production image:  JWT_SECRET=$(openssl rand -hex 32) docker compose --profile full up --build
# The database credentials are throwaway local defaults; override them via environment variables.
services:
  db:
    image: postgres:17-alpine
    container_name: orbit-pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_pms}
    ports:
      # Host port 5433 avoids clashing with any PostgreSQL already running on 5432.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - orbit-pms-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orbit_pms}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['full']
    build: ./backend
    container_name: orbit-pms-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-orbit_pms}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET, e.g. JWT_SECRET=$(openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - '${API_PORT:-4000}:4000'

volumes:
  orbit-pms-data:
